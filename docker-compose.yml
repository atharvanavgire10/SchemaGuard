version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}
      POSTGRES_DB: ${POSTGRES_DB:-schemaguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  server:
    build:
      context: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}@db:5432/${POSTGRES_DB:-schemaguard}
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on:
      - db

  client:
    build:
      context: ./client
    ports:
      - "5173:80"

volumes:
  postgres_data:

