name: SchemaGuard API Compatibility Check

on:
  pull_request:
    paths:
      - 'api/**'
      - 'openapi.yml'
      - 'openapi.yaml'
      - 'schema/**'
      - '**/*.schema.json'

jobs:
  schemaguard:
    name: API Compatibility Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install SchemaGuard dependencies
        run: npm ci
        working-directory: server

      - name: Run SchemaGuard compatibility check
        id: check
        env:
          SCHEMAGUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCHEMAGUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCHEMAGUARD_REPORT: /tmp/schemaguard-report.json
        run: |
          node src/scripts/ciCheck.js
        working-directory: server

      - name: Post SchemaGuard comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '/tmp/schemaguard-report.json';
            const report = fs.existsSync(reportPath) ? JSON.parse(fs.readFileSync(reportPath, 'utf8')) : { classification: 'SAFE', results: [] };
            const classification = report.classification;
            const score = classification === 'SAFE' ? 100 : 'review required';
            const details = report.results.flatMap(r => r.changes.map(c => `- \`${r.file}\` · \`${c.path}\`: ${c.change}`)).join('\n');
            const body = classification === 'SAFE'
              ? `## SchemaGuard ✅ No Breaking Changes\n\nCompatibility Score: ${score}/100\n\n${report.results.length ? 'All changed schema contracts are backwards compatible.' : 'No changed *.schema.json contracts were found.'}`
              : `## SchemaGuard ${classification === 'BREAKING' ? '🚨 Breaking Changes Detected' : '⚠️ Risky Changes Detected'}\n\nCompatibility Score: ${score}\n\n${details}\n\nReview required before merging.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

